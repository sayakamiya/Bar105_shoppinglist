<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bar105 ショッピングリスト</title>
<style>
  body {margin:0;background:#1a1a1a;color:#eee;font-family:'Segoe UI',sans-serif;}
  header{padding:16px;background:#111;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;}
  main{padding:20px;max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  h2{border-left:4px solid #b48a5a;padding-left:8px;margin:8px 0}
  .card{background:#181818;padding:16px;border-radius:10px;border:1px solid #333;}
  input[type='number']{width:70px;background:#222;border:1px solid #444;color:#fff;padding:4px;border-radius:4px;text-align:center;}
  .menu-row,.item-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .menu-controls button,.item-controls button{width:34px;height:28px;border-radius:6px;border:none;background:#333;color:#fff;cursor:pointer}
  .copy-btn,.reset-btn{padding:10px 18px;background:#b48a5a;color:#000;border:none;border-radius:6px;cursor:pointer;margin-top:10px;margin-right:8px}
  textarea{width:100%;height:200px;background:#111;color:#fff;border:1px solid #444;border-radius:6px;padding:8px;}
  .stores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:900px){main{grid-template-columns:1fr;}.stores{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Bar105 ショッピングリスト</h1>
  <button onclick="toggleMode()" id="modeBtn">PCモード</button>
</header>

<main>
  <div class="card">
    <h2>メニュー（飲み物）</h2>
    <div id="drinkMenu"></div>
    <h2>メニュー（食べ物）</h2>
    <div id="foodMenu"></div>
  </div>

  <div class="card">
    <h2>プレビュー（材料一覧）</h2>
    <textarea id="preview" readonly></textarea>
    <div style="margin-top:8px">
      <button class="copy-btn" onclick="copyTotal()">合計金額をコピー</button>
      <button class="reset-btn" onclick="resetAll()">リセット</button>
    </div>
  </div>

  <div class="card" style="grid-column: span 2;">
    <h2>材料一覧（店舗別）</h2>
    <div class="stores">
      <div><h3>店舗①</h3><div id="store1"></div></div>
      <div><h3>店舗②</h3><div id="store2"></div></div>
      <div><h3>店舗③</h3><div id="store3"></div></div>
    </div>
  </div>
</main>

<script>
const items = {
 'ショウガ':300,'チェダーチーズ':300,'にんにく':300,'きのこ':2400,'トマト':1200,'豚肉':500,'みかん':1200,
 'ミント':600,'くるみ':300,'まめ':200,'落花生':200,'りんご':1500,'油':300,'塩':1000,
 '砂糖':300,'ガムシロップ':1500,'ココアパウダー':600,'小麦粉':300,'イースト':300,
 '炭酸水':1200,'牛乳':600,'料理酒':3000
};
const storeGroup={1:['ショウガ','チェダーチーズ','にんにく','きのこ','トマト','豚肉','みかん','ミント','くるみ','まめ','落花生','りんご','油','塩'],2:['砂糖','ガムシロップ','ココアパウダー','小麦粉','イースト'],3:['炭酸水','牛乳','料理酒']};

const menus = {
 'テキーラサンライズ':{cat:'drink','砂糖':1,'炭酸水':1,'みかん':1}, 'マティーニ':{cat:'drink','料理酒':1},
 'マンハッタン':{cat:'drink','料理酒':1}, 'モヒート':{cat:'drink','砂糖':1,'炭酸水':1,'ミント':1},
 'ウィスキー(ロック)':{cat:'drink','砂糖':1,'炭酸水':1,'ミント':1}, 'ジントニック':{cat:'drink','砂糖':1,'炭酸水':1},
 'カルーアミルク':{cat:'drink','ココアパウダー':1,'砂糖':1,'牛乳':1}, 'ファジーネーブル':{cat:'drink','砂糖':1,'みかん':1},
 'ビール':{cat:'drink','砂糖':1,'イースト':1,'小麦粉':1},
 'アヒージョ':{cat:'food','にんにく':1,'きのこ':1,'油':1}, 'カプレーゼ':{cat:'food','トマト':1,'チェダーチーズ':1},
 'りんごとシナモンのスティック':{cat:'food','りんご':1,'ショウガ':1,'砂糖':1}, '生ハム':{cat:'food','豚肉':1,'塩':1},
 'ミックスナッツ':{cat:'food','くるみ':1,'まめ':1,'落花生':1}
};

let autoState={}, manualState={}, menuState={};
function ensure(){Object.keys(items).forEach(n=>{if(autoState[n]==null)autoState[n]=0;if(manualState[n]==null)manualState[n]=0;});}

function escapeId(s){return s.replace(/[^a-z0-9_-]/gi,'_');}
function escapeJs(s){return s.replace(/'/g,"\\'");}

function renderMenus(){
 let d=document.getElementById('drinkMenu'),f=document.getElementById('foodMenu');d.innerHTML='';f.innerHTML='';
 Object.keys(menus).forEach(n=>{
  if(menuState[n]==null)menuState[n]=0;
  let row=document.createElement('div');row.className='menu-row';
  row.innerHTML=`<div style='flex:1'>${n}</div>
   <div class='menu-controls'>
    <button onclick="changeMenu('${escapeJs(n)}',-1)">-</button>
    <input id="m-${escapeId(n)}" type="number" value="${menuState[n]}" min="0" onchange="setMenu('${escapeJs(n)}',this.value)" />
    <button onclick="changeMenu('${escapeJs(n)}',1)">+</button>
   </div>`;
  (menus[n].cat==='drink'?d:f).appendChild(row);
 });
}

function renderItems(){
 ensure();
 ['store1','store2','store3'].forEach(id=>document.getElementById(id).innerHTML='');
 Object.keys(items).forEach(n=>{
  let disp=Math.max(0,(autoState[n]||0)+(manualState[n]||0));
  let row=document.createElement('div');row.className='item-row';
  row.innerHTML=`<div style='flex:1'>${n} (¥${items[n]})</div>
   <div class='item-controls'>
    <button onclick="changeItem('${escapeJs(n)}',-1)">-</button>
    <input id="i-${escapeId(n)}" type="number" min="0" value="${disp}" onchange="setItemInput('${escapeJs(n)}',this.value)" />
    <button onclick="changeItem('${escapeJs(n)}',1)">+</button>
   </div>`;
  if(storeGroup[1].includes(n))document.getElementById('store1').appendChild(row);
  else if(storeGroup[2].includes(n))document.getElementById('store2').appendChild(row);
  else document.getElementById('store3').appendChild(row);
 });
}

// === メニュー → 自動
function changeMenu(n,d){menuState[n]=Math.max(0,(menuState[n]||0)+d);setMenu(n,menuState[n]);}
function setMenu(n,v){menuState[n]=Math.max(0,Number(v)||0);applyRecipe();}

function applyRecipe(){
 let base={};Object.keys(items).forEach(i=>base[i]=0);
 Object.keys(menuState).forEach(m=>{
  let c=menuState[m]||0;
  Object.keys(menus[m]).forEach(mat=>{
   if(mat==='cat')return;
   base[mat]=(base[mat]||0)+menus[m][mat]*c;
  });
 });
 autoState=base; ensure(); renderItems(); preview();
}

// === 材料手動
function setItemInput(n,v){
 let disp=Math.max(0,Number(v)||0);
 manualState[n]=disp-(autoState[n]||0);
 if(manualState[n]<0)manualState[n]=0;
 renderItems(); preview();
}
function changeItem(n,d){
 let inp=document.getElementById('i-'+escapeId(n));
 let newVal=Math.max(0,(Number(inp.value)||0)+d);
 setItemInput(n,newVal);
}

// === プレビュー
function preview(){
 let txt='',total=0;
 Object.keys(items).forEach(n=>{
  let q=Math.max(0,(autoState[n]||0)+(manualState[n]||0));
  if(q>0){let cost=q*items[n];txt+=`${n}：${q} 個 × ¥${items[n].toLocaleString()} = ¥${cost.toLocaleString()}\n`;total+=cost;}
 });
 txt+=`\n合計金額：¥${total.toLocaleString()}`;
 document.getElementById('preview').value=txt;
}

// === コピー
function copyTotal(){let t=0;Object.keys(items).forEach(n=>{t+=Math.max(0,(autoState[n]||0)+(manualState[n]||0))*items[n];});navigator.clipboard.writeText(`合計金額：¥${t.toLocaleString()}`);alert('コピーしました');}

// === リセット
function resetAll(){autoState={};manualState={};menuState={};ensure();renderMenus();renderItems();preview();}

// === モード
function toggleMode(){let b=document.getElementById('modeBtn');if(b.innerText.includes('PC')){b.innerText='スマホモード';document.body.style.fontSize='18px';}else{b.innerText='PCモード';document.body.style.fontSize='';}}
function autoMode(){if(window.innerWidth<600){document.body.style.fontSize='18px';}}

autoMode();ensure();renderMenus();applyRecipe();
</script>
</body>
</html>
